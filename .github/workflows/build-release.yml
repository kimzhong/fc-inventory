name: build-release

# Build + publish a v3.0.0+ release on every tag push (v*.*.*).
# Three jobs:
#   1. build-windows-exe  -> PyInstaller .exe + zip
#   2. build-docker       -> linux/amd64 + linux/arm64 multi-arch image, push to GHCR
#   3. publish            -> attach all artifacts + aggregated SHA256SUMS to the Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest

  build-windows-exe:
    name: build-windows-exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - run: uv sync --all-extras --dev
      - name: Build .exe with PyInstaller
        run: |
          uv run pyinstaller --noconfirm --onedir --name FCInventoryTool `
            --add-data "app/templates;app/templates" `
            --add-data "static;static" `
            --add-data "CHANGELOG.md;." `
            --add-data "LICENSE;." `
            --add-data "README.md;." `
            --hidden-import waitress `
            app/__main__.py || uv run pyinstaller --noconfirm --onedir --name FCInventoryTool `
            --add-data "app/templates;app/templates" `
            --add-data "static;static" `
            --add-data "CHANGELOG.md;." `
            --add-data "LICENSE;." `
            --add-data "README.md;." `
            app/main.py
      - name: Get version from tag
        id: version
        shell: bash
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Zip the .exe bundle
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/FCInventoryTool" -DestinationPath "FCInventoryTool-${{ steps.version.outputs.tag }}-windows.zip" -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fc-inventory-windows-amd64
          path: FCInventoryTool-*.zip
          retention-days: 90

  build-docker:
    name: build-docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Build + push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: publish-release
    needs: [build-windows-exe, build-docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: fc-inventory-windows-amd64
          path: artifacts
      - name: Aggregate SHA-256 checksums
        working-directory: artifacts
        run: |
          ( find . -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0 \
            | xargs -0 -I{} sha256sum {} \
            | sed 's| \./| |' \
            | sort -k2 \
          ) > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
      - name: Update Docker Hub description
        if: always()
        run: |
          echo "Docker image: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}"
