[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fc-inventory"
version = "3.0.0"
description = "Web-based Huawei FusionCompute inventory collector with multi-sheet Excel export (RVTools-style)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sukrit Phiboon" },
]
keywords = ["fusioncompute", "huawei", "inventory", "rvtools", "excel"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "httpx>=0.27,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "openpyxl>=3.1,<4.0",
    "structlog>=24.4,<25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "respx>=0.21",         # async httpx mocking (alternative to MockTransport)
    "freezegun>=1.5",
    "types-openpyxl",
]

[project.urls]
Homepage = "https://github.com/sukritphiboon/fc-inventory"
Issues = "https://github.com/sukritphiboon/fc-inventory/issues"

[project.scripts]
fc-inventory = "app.main:app"   # uvicorn entrypoint name (the actual server is `uvicorn app.main:app`)

# ── Tooling config ──────────────────────────────────────────

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["templates/*.html", "templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = [
    "E501",  # line too long (we accept long lines in docstrings / URLs)
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends())
]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --cov=app --cov-report=term-missing"
# Coverage gate is enforced in CI, not locally during development.
# Set FC_INVENTORY_REQUIRE_COVERAGE=1 to re-enable the --cov-fail-under gate.
